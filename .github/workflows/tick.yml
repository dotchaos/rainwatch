name: tick
# Self-sustaining 15-minute clock. GitHub's cron is best-effort and never fired for this repo,
# so each tick waits, starts an update, then starts the next tick. Workflow dispatches made
# with GITHUB_TOKEN are allowed to create runs, which is what keeps the chain alive.
# cancel-in-progress guarantees only one chain exists: starting a new tick cancels any other.
on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"   # backup restarter, in case GitHub's scheduler ever starts working

permissions:
  actions: write

concurrency:
  group: tick
  cancel-in-progress: true

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Start an update now
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        # GitHub's dispatch API sometimes returns 5xx; retry instead of losing this update
        run: |
          for i in 1 2 3 4 5; do
            gh workflow run update.yml -R ${{ github.repository }} --ref main && exit 0
            sleep $((i * 15))
          done
          exit 1
      - name: Wait 15 minutes
        run: sleep 900
      - name: Start the next tick
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        # a single 5xx here used to end the chain until the unreliable cron backup fired; retry
        run: |
          for i in 1 2 3 4 5 6; do
            gh workflow run tick.yml -R ${{ github.repository }} --ref main && exit 0
            sleep $((i * 20))
          done
          exit 1
