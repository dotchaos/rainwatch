name: update
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rainwatch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests
        if: github.event_name != 'schedule'
        run: pytest -q

      - name: Check out data branch (forecast archive, gauge history, alert state)
        run: |
          git config user.name "rainwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch -q origin data
            git worktree add -B data data origin/data
          else
            git worktree add --detach data
            cd data && git checkout -q --orphan data && git rm -rq --cached . && git clean -fdq && cd ..
          fi

      - name: Forecast
        id: forecast
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RAINWATCH_CONTACT: ${{ vars.RAINWATCH_CONTACT || github.repository }}
          RAINWATCH_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m rainwatch --out site --data data

      # The card app (one adaptive UI, 4 scenario fixtures as its regression suite) reads site/live.json and becomes the front page (Python writes a fallback that forwards to /details/).
      # A broken card build never blocks publishing the main page.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: card/package-lock.json
      - name: Card app (tests against the 4 scenarios, build to the front page)
        id: card
        continue-on-error: true
        working-directory: card
        run: |
          npm ci --no-audit --no-fund
          npx vitest run src/lib/rules.test.ts src/lib/unknown.test.ts src/lib/amounts.test.ts
          npm run build
          cp -r dist/. ../site/
      - name: Check the live card against the same rules as the fixtures
        id: cardcheck
        continue-on-error: true
        working-directory: card
        run: LIVE_JSON=../site/live.json npx vitest run src/lib/live.test.ts

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retrying (GitHub sometimes needs a moment to register the upload)
        if: steps.deploy.outcome == 'failure'
        run: sleep 45
      - name: Retry publish once if GitHub Pages hiccuped
        id: deploy2
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Save archive (retries if another job pushed at the same moment)
        if: always() && steps.forecast.outcome == 'success'
        run: |
          cd data
          git add -A
          git commit -qm "update $(date -u +%FT%TZ)" || { echo "no changes"; exit 0; }
          for i in 1 2 3 4 5; do
            git push -q origin data && exit 0
            echo "push rejected, rebasing (attempt $i)"
            git pull -q --rebase origin data || git rebase --abort
            sleep $((i * 3))
          done
          echo "::error::could not save archive after 5 attempts"; exit 1

      - name: Flag the run as failed if the page could not be published
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome != 'success'
        run: |
          echo "::error::Page was not published (both attempts failed); archive was still saved."
          exit 1

      - name: Flag the run if the live card failed
        if: steps.card.outcome == 'failure' || steps.cardcheck.outcome == 'failure'
        run: |
          echo "::error::Live card build or contract check failed (the details page was still published)."
          exit 1
