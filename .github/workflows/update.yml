name: update
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rainwatch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests
        if: github.event_name != 'schedule'
        run: pytest -q

      - name: Check out data branch (forecast archive, gauge history, alert state)
        run: |
          git config user.name "rainwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch -q origin data
            git worktree add -B data data origin/data
          else
            git worktree add --detach data
            cd data && git checkout -q --orphan data && git rm -rq --cached . && git clean -fdq && cd ..
          fi

      - name: Forecast
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RAINWATCH_CONTACT: ${{ vars.RAINWATCH_CONTACT || github.repository }}
          RAINWATCH_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m rainwatch --out site --data data

      - name: Save archive
        run: |
          cd data
          git add -A
          git commit -qm "update $(date -u +%FT%TZ)" || echo "no changes"
          git push -q origin data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
